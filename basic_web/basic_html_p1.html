<!DOCTYPE html>
<!-- to generate boilerplate, just add exclamation in the editor -->
<!-- This denotes which html version (html v5) we're using in the html code known as (emmets) -->

<html lang="en">
<head>
    <!-- all the linking of css/js and other files onto the html page is defined here, stores metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        basic html Part 1
        <!-- Includes what is displayed in the tab -->
    </title>
</head>

<body>
    <h1>heading: H1</h1>
    <h2>heading: H2</h2>
    <h3>heading: H3</h3>
    <h4>heading: H4</h4>
    <h5>heading: H5</h5>
    <h6>heading: H6</h6>
    <p>
        this is a paragraph.</br>
        this is next line
    </p>

    <h2>Unordered List:</h2>
    <ul>
        <li>Element 1</li>
        <li>Element 2</li>
    </ul>
    <h2>Ordered List:</h2>
    <ol type="a">
        <li>Element 1</li>
        <li>Element 2</li>
    </ol>
    <!-- Li tag can include all other basic tags like heading, paragraph, bolt -->
</body>
</html>
